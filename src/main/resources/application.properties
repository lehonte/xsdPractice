spring.datasource.url=jdbc:postgresql://localhost:5432/xsdPractice
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.flyway.placeholders.admin_number=${ADMIN_NUMBER}

spring.application.name=xsdPractice
server.port=8080

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example

spring.kafka.producer.acks=all
spring.kafka.producer.retries=100
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true